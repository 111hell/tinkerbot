# 唯一配置模板。按需复制为 config.yaml（已被 Git 忽略）。
# 直接在 YAML 中填写以下配置，无需 .env 文件。
# 模型、Agent、存储、监听地址和日志设置从此文件读取，加载时不补默认值。
# 也支持 "${变量名}" 引用已导出的环境变量；程序不会自动加载 .env。
# CLI：go run ./cmd/tinkerbot -config config.example.yaml -channel cli
# CLI + SIU：go run ./cmd/tinkerbot -config config.example.yaml

# 共享模型与 Agent
model:
  api_key: "" # 必填，CLI 与 SIU 共用；也可填 "${DEEPSEEK_API_KEY}"。
  base_url: "https://api.deepseek.com"
  name: "deepseek-v4-flash"

agent:
  system_prompt: "You are a helpful assistant. Answer concisely, use enabled tools when relevant, and never invent data."
  run_timeout: 2m

tools: [] # 全局通用工具；与渠道 tools 合并。

# 启用的渠道与追加工具
channels:
  - type: cli
    tools: []
  - type: siu
    tools: [siu_list_messages, siu_search_contacts, siu_query_user]
    # siu_search_contacts、siu_query_user 需要特权 Bot；query_user 空参数查询当前发言用户。
    # 可追加：siu_search_chats（需要特权 Bot）。
    # 可追加：siu_send_photo、siu_edit_message、siu_revoke_message、siu_send_event。
    # 修改/发送类工具按需显式启用，目标由当前会话确定。

# SIU 接入设置，仅启用 SIU 时使用
siu:
  receive_mode: webhook # webhook（默认）或 polling；本地连接 internal 使用 polling，无需监听端口。
  base_url: "" # SIU 服务地址，可带 /api/v1；也可填 "${SIU_BASE_URL}"。
  bot_token: "" # SIU Bot 凭证；也可填 "${SIU_BOT_TOKEN}"。
  webhook_url: "" # SIU 可访问的回调地址，含 /webhook；空值保留服务端配置。也可填 "${TINKERBOT_WEBHOOK_URL}"。
listen_addr: ":8080" # 仅 webhook 使用；polling 可为空。

# 共享历史、Skill 与日志
sqlite:
  path: "tinkerbot.db" # 空字符串使用内存，不持久化。
skills_dir: "" # 非空时加载 */SKILL.md，内容加入共享提示词。
log_level: "info"
